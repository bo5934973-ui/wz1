        text-shadow: 0 1px 12px rgba(0, 0, 0, 0.34);
      }
      .project-info-title {
        color: #ffffff;
        letter-spacing: 0;
        text-shadow: 0 2px 18px rgba(0, 0, 0, 0.42);

      .project-info-track {
